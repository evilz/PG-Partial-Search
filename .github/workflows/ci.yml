name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and audit direct and transitive packages
        run: >-
          dotnet restore PGPartialSearch.sln
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905'
      - run: dotnet build PGPartialSearch.sln -c Release --no-restore
      - run: dotnet test PGPartialSearch.sln -c Release --no-build
